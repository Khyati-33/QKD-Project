experiment_name: smoke_test
models: [LSTM, GNN]
seed: 20260927
hidden_dim: 8
device: cpu
cpu_threads: 4
model:
  dropedge_probability: 0.05

environment:
  season: monsoon
  use_case: defence
  node_feature_mode: relative
  time_of_day_hours: 22.0
  time_jitter_hours: 1.0
  dt_seconds: 300
  max_steps: 40
  disabled_reward_terms: []

training:
  bc_epochs: 1
  bc_episodes_per_epoch: 1
  bc_entropy_coef: 0.02
  ppo_epochs: 2
  steps_per_epoch: 3
  update_epochs: 1
  batch_size: 3
  learning_rate: 0.00003
  clip_epsilon: 0.1
  entropy_start: 0.003
  critic_warmup_epochs: 1
  gamma: 0.99
  gae_lambda: 0.9
  actor_learning_rate: 0.00003
  critic_learning_rate: 0.00003
  value_clip_epsilon: 0.2
  max_grad_norm: 0.5
  reward_normalization: true

evaluation:
  seasons: [normal]
  eval_seeds_per_season: 1
  interval: 1

protected_conditions:
  source_destination:
    value: {source: Delhi, destination: Chennai}
    override: false
  qber_hard: {value: 0.11, override: false}
  fiber_outage_prob: {value: 0.01, override: false}
  seasons:
    value: [normal, summer, winter, monsoon]
    override: false
  eval_seeds_per_season: {value: 1, override: true}
  trust_chain_reset_rule:
    value: full_tn_clears_hop_qbers
    override: false
  reward_hacking_protections:
    value:
      step_cost: -0.1
      revisit: -1.0
      switch: -0.25
      security_penalty: -10.0
      depletion_penalty: -5.0
      backtrack: -0.5
    override: false
  evaluation_baselines:
    value: [Random, Dijkstra-km, BFS-hop, Max-SKR]
    override: false
  randomize_endpoints: {value: false, override: false}
